name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memyra
          POSTGRES_PASSWORD: memyra_test
          POSTGRES_DB: memyra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memyra -d memyra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://memyra:memyra_test@localhost:5432/memyra_test
      TEST_DATABASE_URL: postgresql://memyra:memyra_test@localhost:5432/memyra_test
      APP_ENV: test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm verify
